# 1. Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-service-coffe
  namespace: coffe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finance-service-coffe
  template:
    metadata:
      labels:
        app: finance-service-coffe
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: finance-service-coffe
          image: ghcr.io/exa-dev-coffe/finance-service-coffe:latest
          ports:
            - name: http
              containerPort: 8087
            - name: grpc
              containerPort: 9087
          startupProbe:
            httpGet:
              path: /health
              port: 8087
            failureThreshold: 10
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8087
            initialDelaySeconds: 3
            periodSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          envFrom:
            - secretRef:
                name: finance-env

---
# 2. Service
apiVersion: v1
kind: Service
metadata:
  name: finance-service-coffe
  namespace: coffe
spec:
  selector:
    app: finance-service-coffe
  ports:
    - name: http
      protocol: TCP
      port: 8087
      targetPort: 8087
    - name: grpc
      protocol: TCP
      port: 9087
      targetPort: 9087
  type: ClusterIP
